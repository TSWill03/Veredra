<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Veredra - leitor de webnovels e ebooks com biblioteca local e leitura offline.">
  <meta name="theme-color" content="#8C6B43">
  <meta name="build-commit" content="__BUILD_COMMIT__">
  <link rel="canonical" href="https://wicolly.com.br/veredra/">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Veredra | Leitor de webnovels e ebooks">
  <meta property="og:description" content="Biblioteca local e leitura offline no navegador.">
  <meta property="og:url" content="https://wicolly.com.br/veredra/">
  <meta name="twitter:card" content="summary">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Veredra">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Veredra</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Move the escape hatch away from the reader's title and top controls. */
    .site-return {
      position: fixed;
      left: max(8px, env(safe-area-inset-left));
      bottom: calc(76px + env(safe-area-inset-bottom));
      z-index: 9999;
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, .28);
      border-radius: 999px;
      background: rgba(25, 20, 16, .88);
      color: #fff;
      font: 700 13px/1 system-ui, sans-serif;
      text-decoration: none;
      white-space: nowrap;
      opacity: .85;
      backdrop-filter: blur(8px);
      transition: opacity .15s ease, padding .15s ease, width .15s ease;
    }
    .site-return-arrow { font-size: 17px; line-height: 1; }
    .site-return:focus-visible { outline: 3px solid #ffd28a; outline-offset: 3px; opacity: 1; }
    html.veredra-reading .site-return {
      left: 0;
      width: 32px;
      min-height: 34px;
      padding: 0;
      border-left: 0;
      border-radius: 0 999px 999px 0;
      opacity: .3;
    }
    html.veredra-reading .site-return-label { display: none; }
    html.veredra-reading .site-return:is(:hover, :focus-visible) {
      width: auto;
      padding: 0 12px;
      opacity: .96;
    }
    html.veredra-reading .site-return:is(:hover, :focus-visible) .site-return-label { display: inline; }
    @media (max-width: 560px) {
      .site-return {
        left: 0;
        width: 32px;
        min-height: 34px;
        padding: 0;
        border-left: 0;
        border-radius: 0 999px 999px 0;
        opacity: .44;
      }
      .site-return-label { display: none; }
      .site-return:is(:hover, :focus-visible) { opacity: .96; }
    }
    @media (display-mode: standalone) { .site-return { display: none; } }
    @media (prefers-reduced-motion: reduce) {
      .site-return { transition: none; }
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <a class="site-return" href="/" aria-label="Voltar ao site Wícolly">
    <span class="site-return-arrow" aria-hidden="true">←</span>
    <span class="site-return-label" aria-hidden="true">Site Wícolly</span>
  </a>
  <script>
    window.veredraSetReadingMode = function (isReading) {
      document.documentElement.classList.toggle('veredra-reading', Boolean(isReading));
    };
    window.veredraReloadForUpdate = async function () {
      // Never clear IndexedDB/CacheStorage: those hold offline books.
      try {
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.getRegistration('/veredra/');
          if (registration) {
            const oldController = navigator.serviceWorker.controller;
            await registration.update();
            if (registration.waiting) {
              registration.waiting.postMessage('skipWaiting');
              if (oldController) {
                await Promise.race([
                  new Promise(resolve => navigator.serviceWorker.addEventListener(
                    'controllerchange', resolve, {once: true})),
                  new Promise(resolve => setTimeout(resolve, 2000)),
                ]);
              }
            }
          }
        }
      } catch (_) { /* Offline updates must never corrupt reading data. */ }
      window.location.replace('/veredra/?updated=' + Date.now());
    };
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
