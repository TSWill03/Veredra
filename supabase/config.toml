project_id = "veredra-local"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://wicolly.com.br/veredra/"
additional_redirect_urls = [
  "http://127.0.0.1:8080/veredra/",
  "http://localhost:7357/",
  "https://wicolly.com.br/veredra/",
  "veredra://auth-callback/"
]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
max_frequency = "1m"
otp_length = 8

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.vector]
enabled = false
