name: Temporary phase 3 normalizer

on:
  push:
    branches:
      - codex/veredra-web-backup

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/veredra-web-backup
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format phase files
        run: |
          dart format \
            lib/services/backup_service_web.dart \
            lib/services/web_download.dart
      - name: Commit normalized files
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            pubspec.lock \
            lib/services/backup_service_web.dart \
            lib/services/web_download.dart
          git commit -m "chore: normalize Web backup files"
          git push origin HEAD:codex/veredra-web-backup
