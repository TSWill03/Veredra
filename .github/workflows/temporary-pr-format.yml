name: Temporary PR formatter

on:
  push:
    branches:
      - codex/veredra-private-library-rollout

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/veredra-private-library-rollout
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - name: Format branch Dart changes
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD -- '*.dart')
          printf 'Formatting %s\n' "${files[@]}"
          dart format "${files[@]}"
      - name: Commit formatting
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.dart'
          git commit -m "style: format all phase 1 Dart changes"
          git push origin HEAD:codex/veredra-private-library-rollout
