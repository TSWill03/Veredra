name: Temporary phase 3B normalizer

on:
  push:
    branches:
      - codex/veredra-book-assets-sync

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/veredra-book-assets-sync
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format changed Dart files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              origin/codex/veredra-web-backup...HEAD -- '*.dart'
          )
          printf 'Formatting %s\n' "${files[@]}"
          dart format "${files[@]}"
      - name: Commit normalized branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock -- '*.dart'
          git commit -m "chore: normalize book asset sync files"
          git push origin HEAD:codex/veredra-book-assets-sync
