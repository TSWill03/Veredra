name: Temporary phase 3B diagnostics

on:
  push:
    branches:
      - codex/veredra-book-assets-sync

permissions:
  contents: write

jobs:
  diagnostics:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/veredra-book-assets-sync
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.38.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Capture diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== FLUTTER ANALYZE ==='
            flutter analyze
            echo
            echo '=== FLUTTER TEST ==='
            flutter test
            echo
            echo '=== FLUTTER BUILD WEB ==='
            flutter build web --release --base-href /veredra/
          } > ci-phase3b-diagnostics.txt 2>&1
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-phase3b-diagnostics.txt
          git commit -m "chore: capture phase 3B diagnostics"
          git push origin HEAD:codex/veredra-book-assets-sync
