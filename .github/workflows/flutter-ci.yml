name: Flutter CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.38.9

jobs:
  quality-and-builds:
    name: Quality, Web and Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting of changed Dart files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            base="HEAD^"
          else
            base="HEAD"
          fi

          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMR "$base" HEAD -- '*.dart'
          )
          if [ "${#dart_files[@]}" -eq 0 ]; then
            echo "No changed Dart files to format."
            exit 0
          fi

          printf 'Checking %s\n' "${dart_files[@]}"
          dart format --set-exit-if-changed "${dart_files[@]}"

      - name: Analyze
        run: flutter analyze

      - name: Test with coverage
        run: flutter test --coverage

      - name: Validate repository security
        run: dart run tool/check_repository_security.dart

      - name: Validate migration contract
        run: dart run tool/validate_migrations.dart

      - name: Build Web at canonical subpath
        run: flutter build web --release --base-href /veredra/

      - name: Patch and validate PWA service worker
        run: |
          dart run tool/patch_flutter_service_worker.dart
          dart run tool/validate_web_build.dart

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Web and Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: veredra-web-android
          path: |
            build/web
            build/app/outputs/flutter-apk/app-debug.apk
            coverage/lcov.info
          if-no-files-found: error

  windows-build:
    name: Windows release build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: veredra-windows
          path: build/windows/x64/runner/Release
          if-no-files-found: error

  database-security:
    name: Supabase migrations and RLS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v2
        with:
          version: latest
          github-token: ${{ github.token }}
      - name: Start local Supabase and apply migrations
        run: supabase start
      - name: Lint database
        run: supabase db lint --local --level warning
      - name: Run pgTAP RLS tests
        run: supabase test db

  web-e2e:
    name: Chromium PWA E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: flutter pub get
      - run: flutter build web --release --base-href /veredra/
      - run: dart run tool/patch_flutter_service_worker.dart
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: veredra-playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
