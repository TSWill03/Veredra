name: Flutter CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Future manual release jobs can add:
      # - flutter build windows
      # - flutter build linux
      # - flutter build apk
      # - flutter build web --release --base-href /veredra/
      # - signed release publication after explicit approval

